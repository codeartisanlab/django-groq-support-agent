<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Agent | Django & Groq</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col h-[650px] overflow-hidden">
        
        <!-- Header -->
        <header class="px-6 py-4 bg-slate-800/60 border-b border-slate-700/50 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <div>
                    <h1 class="text-sm font-semibold tracking-wide text-white">Store Support AI Agent</h1>
                    <p class="text-xs text-slate-400">Django 5 + Groq Llama 3.3</p>
                </div>
            </div>
            <span class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded border border-slate-700 text-slate-300">Tool Calling</span>
        </header>

        <!-- Message Feed -->
        <div id="chat-stream" class="flex-1 p-6 overflow-y-auto space-y-4 text-sm">
            <div class="bg-slate-800/80 border border-slate-700/60 text-slate-200 p-4 rounded-xl max-w-[85%] leading-relaxed">
                Namaste! Main aapka AI assistant hoon. Aap store policy puch sakte hain ya seedha apna <span class="text-indigo-400 font-mono">Order ID</span> provide karke real-time status track kar sakte hain.
            </div>
        </div>

        <!-- Input Box -->
        <footer class="p-4 bg-slate-800/40 border-t border-slate-800 flex gap-2">
            <input 
                id="query-input" 
                type="text" 
                placeholder="Order number (e.g. ORD-1001) ya sawaal puchein..."
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            >
            <button 
                id="submit-btn" 
                onclick="handleSend()" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-3 rounded-xl text-sm transition cursor-pointer disabled:opacity-50">
                Send
            </button>
        </footer>
    </div>

    <script>
        const chatStream = document.getElementById('chat-stream');
        const queryInput = document.getElementById('query-input');
        const submitBtn = document.getElementById('submit-btn');

        async function handleSend() {
            const query = queryInput.value.trim();
            if (!query) return;

            // Render user bubble
            chatStream.innerHTML += `
                <div class="bg-indigo-600 text-white p-3 rounded-xl max-w-[80%] ml-auto text-sm leading-relaxed shadow-sm">
                    ${query}
                </div>`;
            queryInput.value = '';
            chatStream.scrollTop = chatStream.scrollHeight;

            submitBtn.disabled = true;
            submitBtn.innerText = 'Calling Tool...';

            try {
                const res = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query })
                });
                const data = await res.json();

                chatStream.innerHTML += `
                    <div class="bg-slate-800/80 border border-slate-700/60 text-slate-200 p-4 rounded-xl max-w-[85%] leading-relaxed">
                        ${data.reply || data.error}
                    </div>`;
            } catch (err) {
                chatStream.innerHTML += `
                    <div class="bg-rose-950/50 border border-rose-800 text-rose-300 p-3 rounded-xl max-w-[85%] text-sm">
                        Server connection error.
                    </div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Send';
                chatStream.scrollTop = chatStream.scrollHeight;
            }
        }

        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
